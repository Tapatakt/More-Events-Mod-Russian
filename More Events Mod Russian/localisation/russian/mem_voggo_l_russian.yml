l_russian:

 mem_voggo_site: "В Облаках"
 mem_voggo_site_desc: "Большая станция висит в верхних слоях атмосферы §Y[From.Planet.GetName]§! \n\nЕго внешний вид, хотя и сильно обветрился от времени и сильных ветров, необычайно роскошен. Сама станция, похоже, давно заброшена."
 mem_voggo.1.name: "Прихожая"
 mem_voggo.1.desc: "Картографирование и каталогизация роскошных интерьеров станции на §YВеспер§! потребовали значительных усилий. Полученные повреждения превратили извилистые переходы в опасные, а воздух внутри стал опасно летучим из-за неисправности систем жизнеобеспечения.\n\nСамым странным во всём этом, кажется, являются декорации. В каждой комнате есть по крайней мере одна статуя или портрет одного и того же индивидуума, принимающего какую-то великолепную позу."
 mem_voggo.2.name: "Море Клонов"
 mem_voggo.2.desc: "По мере того как археологи на §YВеспер§! продвигались в глубь интерьеров станции, они начали сталкиваться с трупами. Некоторые были убиты выстрелами, лезвиями и тупыми предметами, но другие, похоже, погибли от отказа системы жизнеобеспечения.\n\nВсе тела выглядят генетически идентичными и имеют сильное сходство с портретами на борту. Однако разные тела демонстрируют разный уровень развития и здоровья — некоторые были значительно изуродованы по сравнению с другими или демонстрируют уменьшенные области черепа.\n\n[Leader.GetName] полагает, что все они являются клонами одного и того же индивидуума, воспроизведёнными с разной степенью успеха. Наиболее деградировавшие, вероятно, стали результатом клонирования в нескольких поколениях."
 mem_voggo.3.name: "Лаборатория Клонирования"
 mem_voggo.3.desc: "Ближе к ядру станции [Leader.GetName] обнаружил несколько комнат, по-видимому, предназначенных для клонирования. Похоже, здесь произошла крупная битва, поскольку большая часть оборудования разбита или расстреляна. В чанах для клонирования всё ещё лежат полусформированные тела, а машины для отбора проб сильно повреждены, как будто кто-то продолжал разбивать их, чтобы добраться до того, кто был внутри."
 mem_voggo.4.name: "Внутреннее Святилище"
 mem_voggo.4.desc: "До сих пор мы считали, что станция заброшена. Мы ошибались.\n\nВ самой внутренней части станции [Leader.GetName] обнаружил запечатанную секцию, изолированную от внешнего мира.\n\nВнутри [Leader.GetSheHe] нашёл живого инопланетянина в анабиозе, который также разделяет внешность с портретами на станции. Судя по отсутствию обезображивающих генетических дефектов, он, скорее всего, является оригинальным шаблоном для клонов, чьи трупы усеивают станцию. После пробуждения он пожелал поговорить с нами."
 mem_voggo.4.pur: "Вместо этого убейте его."
 mem_voggo.4.swarm: "Вместо этого съешьте его."
 mem_voggo.5.name: "Вогго Великий"
 mem_voggo.5.desc: "§HУсевшись на роскошный трон, ожидавший его рядом со стазис-камерой, он теперь тихо парит чуть выше уровня глаз.§!\n\nАх, кто-то пришёл освободить меня из заточения!\n\n§HОн напыщенно откашливается.§!\n\nПожалуйста, позвольте мне представиться. Я §SВогго Великий§!, также известный как Великолепный, Мудрый, Помазанный, Преследуемый, Изгоняемый, Преданный и Изгнанник."
 mem_voggo.5.a: "Добро пожаловать на борт."
 mem_voggo.5.b: "Мы бы предпочли не надо."
 mem_voggo.5.c: "Можете рассказать нам больше о себе?"
 mem_voggo.5.c.response: "Когда-то я был правителем великой и щедрой §YВоркунской Республики§!, вы знакомы с этим названием?\n\nНет? Я так и думал... Поделом им.\n\nТеперь, когда я наконец свободен, позвольте предложить вам мои услуги. Я самый способный администратор, которого вам когда-либо доведётся узнать."
 mem_voggo.5.d: "Вы говорили, что вас изгнали?"
 mem_voggo.5.d.response: "О, это захватывающая история, полная интриг, коварства и предательства. Я написал о ней книгу несколько десятилетий назад, но, кажется, случайно пропустил её через одну из пищевых машин. Не волнуйтесь, я напишу другую. А пока позвольте дать вам сокращённую версию:\n\n§YВоркунская Республика§!, из которой я родом, когда-то была могущественной империей на галактической арене, а я был её избранным лидером. Хотя моя власть не была абсолютной, я был наделён талантами, которых не имели другие. Я мог видеть то, что скрыто от большинства. Люди смотрели на меня с восхищением и советовались со мной по важным вопросам, признавая мою безграничную мудрость. Времена были хороши... какое-то время.\n\n§HОн вздыхает с явно театральным эффектом.§!\n\nНо быть наделённым предвидением и властью может быть ужасным проклятием. Пока другие воркуны жили своей жизнью в блаженном неведении, я предвидел страшную катастрофу. Я видел надписи на стене, и это были в основном непристойные каракули.\n\nЯ предстал перед Великим Сенатом, заявив, что у них есть выбор — дать мне абсолютную власть или погибнуть. Они ответили, что у меня тоже есть выбор — изгнание или смерть. Они сделали свой выбор, и я сделал свой. Судя по всему, я был прав, а они ошибались."
 mem_voggo.5.e: "Что случилось на этой станции?"
 mem_voggo.5.e.response: "О, эта моя частная станция? Это была моя тихая гавань, моё убежище. Ну, ей следовало бы ею быть, но всё пошло не так, как задумывалось.\n\nПрибыв в изгнание, я остался совершенно без друзей, союзников и компаньонов, и у меня не было иного выбора, кроме как создать их самому. И кто ещё мог претендовать на эту должность, если не тот, кто разделяет мой безграничный интеллект? Поэтому я приобрёл несколько машин для клонирования и приступил к работе.\n\nОднако результат оказался более несовершенным, чем я предполагал, поскольку мои клоны не были наделены таким же уровнем терпения и сострадания, как я. Вся эта братия сговорилась и обратилась против меня.\n\nПока я искал убежища в своём внутреннем святилище, они ополчились друг на друга, и каждый пытался клонировать себя в армию, чтобы получить преимущество. Из безопасности своего святилища я продолжал наблюдать. Вскоре первое поколение клонов погибло, но каждый оставил после себя своих клонов.\n\nПоколение за поколением они становились всё многочисленнее и всё менее разумными, пока в конце концов система жизнеобеспечения не перестала справляться с их растущей численностью. Меня защищало моё личное оборудование, пока они задыхались.\n\nЭто было весело, пока длилось, но я рад, что все они теперь мертвы."
 mem_voggo.5.f: "Почему вы были в стазисе?"
 mem_voggo.5.f.response: "§HДосада в его голосе ощутима, когда он отвечает...§!\n\nВы были снаружи этой комнаты. Вы видели опустошение, которое оставили после себя мои клоны. Куда я мог бы податься? С отключённым коммуникационным реле позвать на помощь тоже не было возможности."
 mem_voggo.7.name:0 "Заброшенная станция"
 mem_voggo.7.desc:0 "При входе в систему [From.GetName] наши датчики обнаружили, по-видимому, заброшенную станцию на орбите местного газового гиганта. Однако первичные сканы указывают, что некоторые её системы могут быть ещё целы."
 mem_voggo.7.a:0 "Исследуйте её."
 mem_voggo.100.name:0 "Предложение"
 mem_voggo.100.desc:0 "Вогго входит в зал аудиенций в весьма возбуждённом состоянии.\n\n§T«У меня появилась идея! Постарайтесь сдержать своё волнение. Вы можете помнить мою предыдущую инициативу по клонированию, завершившуюся тем, что историки настаивают называть *катастрофическим крахом разума*. Несправедливое описание. Это был, в худшем случае, чрезмерно восторженный процесс экспертной оценки.\n\nФундаментальная концепция, однако, была безупречной. Ошибка заключалась в том, что я позволил существовать несовершенным копиям совершенства. Прискорбный недосмотр, на исправление которого я потратил десятилетия — в теории.\n\nВ этот раз всё будет иначе. Представьте: больше Вогго! Один будет управлять вашей империей, другой — советовать ей, третий — представлять её! Продуктивность выросла бы как минимум на несколько сотен процентов! По консервативной оценке, разумеется...»§!"
 mem_voggo.100.a:0 "Сделайте это!"
 mem_voggo.100.b:0 "Ни за что!"
 mem_voggo.110.name:0 "Великий успех"
 mem_voggo.110.desc:0 "В праздничном тоне Вогго обращается к своей аудитории — различным правительственным чиновникам, а также нашему уважаемому [root.owner.GetRulerTitle].\n\n§T«Фаза планирования завершена с оглушительным успехом! Каждое вычисление проверено, каждый изъян моей предыдущей попытки исправлен, и каждый протокол безопасности написан и дважды проверен единственным индивидуумом, достойным рецензировать мою работу: мной самим. Конструкция столь же элегантна, сколь и функциональна.\n\nПолагаю, это то, что менее значительные учёные называют „обучением на опыте“. Что оставляет нас с одним довольно обыденным препятствием.\n\nМашина пока не существует в физическом мире. К сожалению, чертежи не способны собираться сами. Сплавы должны быть выкованы, схемы установлены, а аппарат клонирования построен. Иными словами, сложная интеллектуальная работа завершена — остаётся инженерия. Я полностью уверен, что ваш народ способен поднимать тяжёлые предметы, пока я наблюдаю.»"
 mem_voggo.110.a:0 "Великолепно."
 mem_voggo.110.b:0 "Давно пора."
 mem_voggo.115.name:0 "[lord_voggo.GetName]"
 mem_voggo.115.desc_first_cloggo:0 "§HВогго Великий входит в зал аудиенций, восседая на своём парящем троне. Раскинув руки в театральном жесте, он объявляет о завершении своей текущей процедуры клонирования.\n\nПо его словам, результат — не что иное, как совершенство: ни единого изъяна не оскверняет его достижение.\n\nОн вызывает своего клона, который входит в зал в схожих, хотя и чуть менее роскошных одеждах, паря на чуть менее роскошном троне. Вогго продолжает представление, объясняя, что его уникальность не будет умалена тем, что кто-то ещё носит его имя. Поэтому он представляет своего клона как Клогго — по сокращению от Клон-Вогго. Никто не решается прокомментировать этот безынициативный выбор имени из страха спровоцировать часовую тираду, разгневав его...\n\nКлогго, приняв молчание за свою очередь, берёт слово.§!\n\nЯ готов занять важный пост и украсить империю своими способностями."
 mem_voggo.115.desc_later_cloggo:0 "§HВогго Великий вновь входит в зал аудиенций, чтобы доложить о своей текущей процедуре клонирования. Его новейший клон, по-видимому, оправдал его высокие ожидания, и поэтому он начинает один из своих бесконечных монологов, сводящихся лишь к самовосхвалению. Чтобы не разгневать его прерыванием речи, вновь прибывший Клогго ждёт своей очереди и в конце концов обращается к нам.§!\n\nЯ готов занять важный пост и украсить империю своими способностями."
 mem_voggo.115.desc_first_floggo:0 "§HВогго Великий входит в зал аудиенций, восседая на своём парящем троне. С видимым недовольством он объявляет, что его текущая процедура клонирования завершилась.\n\nОднако результат, как он продолжает объяснять, оказался неудовлетворительным. Его стремление к совершенству было осквернено безошибочно узнаваемыми изъянами.\n\nОн вызывает своего клона, который входит в зал в схожих, хотя и заметно менее роскошных одеждах, паря на довольно простом с виду троне. Невзирая на вышеупомянутые изъяны, Вогго заверяет нас, что клон, которого он называет Флогго — по-видимому, слияние „провальный Клон-Вогго“, — будет полностью способен выполнять любую данную должность. Игнорируя более чем сомнительное чувство наименования Вогго, представление продолжается, и Флогго берёт слово.§!\n\nЯ готов доказать свою состоятельность!"
 mem_voggo.115.desc_later_floggo:0 "§HВогго Великий вновь входит в зал аудиенций, чтобы доложить о своей текущей процедуре клонирования. По-видимому, его постигла ещё одна неудача на пути к совершенству. Вплотную за ним в зал следует ещё один Флогго, явно различимый по своему сравнительно скромному одеянию и трону. Вопреки своему обычному поведению, Вогго, похоже, не в настроении для пространного монолога, поэтому вновь прибывший Флогго пользуется возможностью произвести первое впечатление.§!\n\nЯ готов доказать свою состоятельность!"
 mem_voggo.115.c:0 "Позолоченная кожа, серьёзно?"
 mem_voggo.115.c.response:0 "Простая ошибка, обернувшаяся возможностью. Разве я не самый великолепный воркун, которого вы когда-либо видели?"
 mem_voggo.115.d:0 "Вы выглядите больным."
 mem_voggo.115.d.response:0 "Вы боитесь меня? Хорошо. Так и должно быть."
 mem_voggo.115.e:0 "Так вы сами выбрали цвет своей кожи?"
 mem_voggo.115.e.response:0 "Без света Перемен вселенная застаивалась бы и рушилась. Только через эту борьбу может произойти любой прогресс."
 mem_voggo.115.f:0 "Пацифист?"
 mem_voggo.115.f.response:0 "Держаться за гнев — всё равно что сжимать раскалённый уголь с намерением бросить его в кого-то другого: обжигаешься ты сам."
 mem_voggo.200.name:0 "Стратегическая перестройка"
 mem_voggo.200.desc:0 "После нескольких недель продуктивных дискуссий Вогго единогласно сочли свой текущий бюджет оскорбительно скромным. Достижение этого вывода так быстро стало своего рода сюрпризом, учитывая их обычную потребность в долгих дипломатических переговорах между членами совета.\n\nТаким образом, они представляют скромную просьбу о дополнительном финансировании. Намеренно сформулированную не как требование, а как вежливое обращение от «расширяющегося коллектива несравненного административного таланта», достойного поддержки."
 mem_voggo.200.a:0 "Хорошо."
 mem_voggo.200.b:0 "Это плохая идея."
 mem_voggo.200.c:0 "Отказано."
 mem_voggo.205.name:0 "Совет Вогго"
 mem_voggo.205.desc:0 "После очередного долгого спора, длившегося не менее четырнадцати часов и завершившегося тем, что каждый участник объявил себя Председателем Совета, было достигнуто следующее заключение и переправлено как официальное коммюнике:\n\n§T«После всестороннего анализа научного прогресса империи мы пришли к единственному неизбежному выводу. Финансирование исследований более чем недостаточно — поистине жалостно недостаточно.\n\nСтатистически говоря, вряд ли найдётся кто-то столь же — не говоря уже более — интеллектуальный, как комната, полная Вогго. По правде говоря, это вряд ли честное сравнение. Хотя мы уверены, что вы в конце концов пришли бы к тому же выводу, мы сэкономили вам несколько лет мучительно тягостных мыслительных процессов.»§!"
 mem_voggo.205.a:0 "Спасибо?"
 mem_voggo.210.name:0 "Горячее соперничество"
 mem_voggo.210.desc:0 "Отличные новости. Всё началось, как и все великие романы, с горячего интеллектуального разногласия. [mem_voggo_married_to.GetName] обвинил меня, [mem_voggo_married.GetName], в непонимании относительно простого экономического прогноза. Я ответил, предположив, что [mem_voggo_married_to.GetName] обладает аналитическими способностями декоративного растения. Дальше дело накалилось. Мы спорили шесть часов. Затем мы остановились, глубоко посмотрели друг другу в глаза и поцеловались. Всё остальное — история."
 mem_voggo.210.a:0 "Что?!"
 leader_trait_mem_voggo_trait: "Вогго Великий"
 leader_trait_mem_voggo_trait_desc: "Вогго Великий — самый мечтательный гений и гениальный провидец. Все пребывают в благоговении перед ним."
 leader_trait_mem_voggo_trait_ruler: "$leader_trait_mem_voggo_trait$"
 leader_trait_mem_voggo_trait_ruler_desc: "$leader_trait_mem_voggo_trait_desc$"
 leader_trait_mem_voggo_trait_effect:0 "Не использует лимит лидеров."
 mem_voggo_catchphrase:0 "$leader_trait_mem_voggo_trait_desc$"
 mem_voggo_background:0 "Вогго Великий когда-то был правителем Воркунской Республики, могущественной галактической империи, которую он вёл своей несравненной мудростью и предвидением. Когда он предвидел катастрофу, в которую Воркунский Сенат отказался верить, он потребовал абсолютной власти, чтобы спасти их... Приняв это за необоснованный захват власти, они предложили ему изгнание или смерть."
 overclock_mem_voggo_default:0 "По умолчанию"
 overclock_mem_voggo_default_desc:0 "Медленно, но верно"
